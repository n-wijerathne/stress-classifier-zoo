<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">System Architecture: Zoo Animal Stress Classifier</text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">IT41043 — Intelligent Systems | Milestone 2 Methodology Pipeline</text>

  <!-- Box 1: Data Ingestion -->
  <rect x="40" y="120" width="220" height="320" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" rx="12"/>
  <text x="150" y="150" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">1. Data Ingestion</text>
  
  <rect x="60" y="175" width="180" height="60" fill="#0f172a" stroke="#64748b" rx="8"/>
  <text x="150" y="200" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Raw Session Logs</text>
  <text x="150" y="220" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">5-Min Observation Bins</text>

  <rect x="60" y="255" width="180" height="60" fill="#0f172a" stroke="#64748b" rx="8"/>
  <text x="150" y="280" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Synthetic Data Gen</text>
  <text x="150" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Stand-in till Zoo Approval</text>

  <rect x="60" y="335" width="180" height="85" fill="#0f172a" stroke="#64748b" rx="8"/>
  <text x="150" y="360" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Feature Categories</text>
  <text x="150" y="380" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Movement &amp; Trajectory</text>
  <text x="150" y="395" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Feeding &amp; Keeper Routine</text>
  <text x="150" y="410" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Temporal &amp; Enclosure</text>

  <!-- Arrow 1 -->
  <path d="M 260 280 L 320 280" stroke="url(#accent)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Box 2: Preprocessing & Feature Engineering -->
  <rect x="320" y="120" width="240" height="320" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" rx="12"/>
  <text x="440" y="150" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">2. Preprocess &amp; Transform</text>

  <rect x="340" y="180" width="200" height="50" fill="#0f172a" stroke="#64748b" rx="8"/>
  <text x="440" y="210" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Time-to-Minutes Encoding</text>

  <rect x="340" y="245" width="200" height="50" fill="#0f172a" stroke="#64748b" rx="8"/>
  <text x="440" y="275" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Derived Duration Calc</text>

  <rect x="340" y="310" width="200" height="50" fill="#0f172a" stroke="#64748b" rx="8"/>
  <text x="440" y="340" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">StandardScaler &amp; OHE</text>

  <rect x="340" y="375" width="200" height="45" fill="#0f172a" stroke="#64748b" rx="8"/>
  <text x="440" y="402" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Stratified 5-Fold Split</text>

  <!-- Arrow 2 -->
  <path d="M 560 280 L 620 280" stroke="url(#accent)" stroke-width="3" fill="none"/>

  <!-- Box 3: Model Architecture Branches -->
  <rect x="620" y="120" width="240" height="320" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" rx="12"/>
  <text x="740" y="150" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">3. Model Branches &amp; Eval</text>

  <rect x="640" y="175" width="200" height="55" fill="#1e1b4b" stroke="#6366f1" rx="8"/>
  <text x="740" y="198" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Baseline Branch</text>
  <text x="740" y="218" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">RF (Trajectory Only) [35.9% F1]</text>

  <rect x="640" y="240" width="200" height="55" fill="#064e3b" stroke="#10b981" rx="8"/>
  <text x="740" y="263" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Branch A (Proposed Tabular)</text>
  <text x="740" y="283" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">RF + SVM (Full Schedule) [68.3% F1]</text>

  <rect x="640" y="305" width="200" height="55" fill="#4c1d95" stroke="#a855f7" rx="8"/>
  <text x="740" y="328" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Branch B (Proposed Sequence)</text>
  <text x="740" y="348" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">LSTM-FCN Time-Series [45.7% F1]</text>

  <rect x="640" y="370" width="200" height="50" fill="#0f172a" stroke="#f43f5e" rx="8"/>
  <text x="740" y="390" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Statistical Significance</text>
  <text x="740" y="408" text-anchor="middle" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="10">Paired t-test (p=0.0365) &amp; McNemar</text>
</svg>
