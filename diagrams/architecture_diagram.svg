<svg viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#ffffff"/>

  <text x="750" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a2e">System Architecture — Feeding-Schedule &amp; Keeper-Routine Stress Classifier</text>

  <!-- ROW 1: Raw data sources -->
  <rect x="40" y="80" width="230" height="90" rx="8" fill="#dbe9f7" stroke="#2c5f8a" stroke-width="2"/>
  <text x="155" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Keeper &amp; Feeding Logs</text>
  <text x="155" y="132" text-anchor="middle" font-size="12" fill="#333">Meal times, diet items,</text>
  <text x="155" y="148" text-anchor="middle" font-size="12" fill="#333">keeper arrival / departure</text>

  <rect x="300" y="80" width="230" height="90" rx="8" fill="#dbe9f7" stroke="#2c5f8a" stroke-width="2"/>
  <text x="415" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Behavioural Observation Log</text>
  <text x="415" y="132" text-anchor="middle" font-size="12" fill="#333">Instantaneous scan-sampled</text>
  <text x="415" y="148" text-anchor="middle" font-size="12" fill="#333">ethogram codes, 5-min bins</text>

  <rect x="560" y="80" width="230" height="90" rx="8" fill="#dbe9f7" stroke="#2c5f8a" stroke-width="2"/>
  <text x="675" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Animal &amp; Session Metadata</text>
  <text x="675" y="132" text-anchor="middle" font-size="12" fill="#333">Species, individual ID,</text>
  <text x="675" y="148" text-anchor="middle" font-size="12" fill="#333">enclosure, date, keeper ID</text>

  <!-- Data ingestion -->
  <rect x="220" y="215" width="380" height="70" rx="8" fill="#f4d9a0" stroke="#8a5a12" stroke-width="2"/>
  <text x="410" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Data Ingestion &amp; Timestamp Alignment</text>
  <text x="410" y="264" text-anchor="middle" font-size="12" fill="#333">Merge logs on animal ID + time; anonymise keeper names</text>

  <!-- Arrows row1 -> ingestion -->
  <path d="M155,170 L155,200 L400,200 L400,215" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M415,170 L415,215" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M675,170 L675,200 L420,200 L420,215" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Preprocessing -->
  <rect x="220" y="320" width="380" height="110" rx="8" fill="#f4d9a0" stroke="#8a5a12" stroke-width="2"/>
  <text x="410" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Preprocessing</text>
  <text x="410" y="365" text-anchor="middle" font-size="12" fill="#333">Missing-log imputation · label cleaning</text>
  <text x="410" y="382" text-anchor="middle" font-size="12" fill="#333">categorical encoding (species, keeper ID)</text>
  <text x="410" y="399" text-anchor="middle" font-size="12" fill="#333">z-score scaling of continuous features</text>
  <text x="410" y="416" text-anchor="middle" font-size="12" fill="#333">day-grouped train/val/test split</text>

  <path d="M410,285 L410,320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feature engineering -->
  <rect x="220" y="465" width="380" height="120" rx="8" fill="#f4d9a0" stroke="#8a5a12" stroke-width="2"/>
  <text x="410" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Feature Engineering</text>
  <text x="410" y="510" text-anchor="middle" font-size="12" fill="#333">Inter-meal interval · diet variety score</text>
  <text x="410" y="527" text-anchor="middle" font-size="12" fill="#333">keeper proximity duration · time-to-keeper-arrival</text>
  <text x="410" y="544" text-anchor="middle" font-size="12" fill="#333">rolling stereotypy rate (windowed)</text>
  <text x="410" y="561" text-anchor="middle" font-size="12" fill="#333">movement/trajectory features (for baseline)</text>

  <path d="M410,430 L410,465" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Split into two branches -->
  <path d="M410,585 L410,610 L260,610 L260,635" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M410,585 L410,610 L1030,610 L1030,635" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch A: tabular -->
  <rect x="80" y="635" width="360" height="80" rx="8" fill="#d7ecd9" stroke="#2e7d32" stroke-width="2"/>
  <text x="260" y="662" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Branch A — Tabular Classifiers</text>
  <text x="260" y="682" text-anchor="middle" font-size="12" fill="#333">Random Forest · SVM (RBF kernel)</text>
  <text x="260" y="699" text-anchor="middle" font-size="12" fill="#333">session-level engineered features</text>

  <!-- Branch B: sequence -->
  <rect x="850" y="635" width="360" height="80" rx="8" fill="#d7ecd9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1030" y="662" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Branch B — LSTM Sequence Model</text>
  <text x="1030" y="682" text-anchor="middle" font-size="12" fill="#333">windowed meal/keeper-event sequences</text>
  <text x="1030" y="699" text-anchor="middle" font-size="12" fill="#333">captures temporal / anticipatory patterns</text>

  <!-- Baseline branch -->
  <rect x="1150" y="465" width="300" height="80" rx="8" fill="#f6d3d3" stroke="#a12e2e" stroke-width="2"/>
  <text x="1300" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Baseline Model</text>
  <text x="1300" y="510" text-anchor="middle" font-size="12" fill="#333">RF on movement/trajectory</text>
  <text x="1300" y="527" text-anchor="middle" font-size="12" fill="#333">features only (no feeding/keeper vars)</text>
  <path d="M600,505 L1150,505" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- Merge to output -->
  <path d="M260,715 L260,760 L750,760 L750,790" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1030,715 L1030,760 L750,760" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M1300,545 L1300,760 L780,760" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Model comparison/eval -->
  <rect x="560" y="790" width="380" height="80" rx="8" fill="#e3d9f4" stroke="#5c2c8a" stroke-width="2"/>
  <text x="750" y="817" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Evaluation &amp; Comparison</text>
  <text x="750" y="837" text-anchor="middle" font-size="12" fill="#333">Stratified group k-fold CV (k=5)</text>
  <text x="750" y="854" text-anchor="middle" font-size="12" fill="#333">F1, AUC-ROC, precision/recall + significance test</text>

  <path d="M750,870 L750,900" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="560" y="900" width="380" height="70" rx="8" fill="#fde3c0" stroke="#9a5a12" stroke-width="2"/>
  <text x="750" y="928" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Output: Stress-Behaviour Prediction</text>
  <text x="750" y="948" text-anchor="middle" font-size="12" fill="#333">Per-session probability + interpretation report for keepers</text>

  <!-- legend -->
  <rect x="40" y="900" width="16" height="16" fill="#f6d3d3" stroke="#a12e2e"/>
  <text x="62" y="913" font-size="12" fill="#333">Baseline path (dashed)</text>
</svg>
